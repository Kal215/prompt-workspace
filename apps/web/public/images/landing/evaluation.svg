<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-eval" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#27272a" stroke-width="0.6" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="600" height="500" fill="#09090b" rx="12"/>
  <rect width="600" height="500" fill="url(#grid-eval)" rx="12"/>
  
  <!-- Window Header -->
  <rect x="20" y="16" width="560" height="38" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <circle cx="40" cy="35" r="4.5" fill="#ef4444"/>
  <circle cx="55" cy="35" r="4.5" fill="#f59e0b"/>
  <circle cx="70" cy="35" r="4.5" fill="#10b981"/>
  <text x="95" y="39" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="600">MODEL ARENA // Multi-Provider Benchmark &amp; Latency</text>
  <text x="560" y="39" fill="#f59e0b" font-family="monospace" font-size="10" text-anchor="end">3 PROVIDERS</text>

  <!-- Evaluation Card Body -->
  <rect x="20" y="64" width="560" height="415" rx="8" fill="#121316" stroke="#27272a" stroke-width="1"/>
  <text x="40" y="96" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Inference Speed &amp; Accuracy Comparison</text>

  <!-- Model 1: Groq Llama 3.3 70B -->
  <rect x="40" y="115" width="520" height="75" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="56" y="140" fill="#f97316" font-family="monospace" font-size="11" font-weight="bold">Groq // Llama-3.3-70B Versatile</text>
  <text x="545" y="140" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">285 tok/s</text>
  <rect x="56" y="154" width="480" height="16" rx="4" fill="#27272a"/>
  <rect x="56" y="154" width="456" height="16" rx="4" fill="#f97316"/>
  <text x="70" y="166" fill="#000000" font-family="monospace" font-size="10" font-weight="bold">Latency: 140ms • Fastest Response</text>

  <!-- Model 2: DeepSeek V3 -->
  <rect x="40" y="200" width="520" height="75" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="56" y="225" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">OpenRouter // DeepSeek-V3 Reasoning</text>
  <text x="545" y="225" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">94.8% Quality</text>
  <rect x="56" y="239" width="480" height="16" rx="4" fill="#27272a"/>
  <rect x="56" y="239" width="440" height="16" rx="4" fill="#38bdf8"/>
  <text x="70" y="251" fill="#000000" font-family="monospace" font-size="10" font-weight="bold">Strict Schema Adherence • High Fidelity</text>

  <!-- Model 3: Gemini 2.5 Flash -->
  <rect x="40" y="285" width="520" height="75" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="56" y="310" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold">Google // Gemini-2.5-Flash</text>
  <text x="545" y="310" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">1M Context</text>
  <rect x="56" y="324" width="480" height="16" rx="4" fill="#27272a"/>
  <rect x="56" y="324" width="380" height="16" rx="4" fill="#a855f7"/>
  <text x="70" y="336" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">Massive Context Window • Multimodal</text>

  <!-- Summary Metric Strip -->
  <rect x="40" y="375" width="520" height="85" rx="6" fill="#18181b" stroke="#27272a"/>
  <text x="60" y="402" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">CONSENSUS BENCHMARK SUMMARY</text>
  <text x="60" y="424" fill="#a1a1aa" font-family="sans-serif" font-size="11">• Cascade Failover: Automatic retry across providers</text>
  <text x="60" y="444" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">✓ Overall Arena Accuracy: 98.4% across 120 eval batches</text>
</svg>